[tool.uv]
package = true

[project]
name = "swayam"
version = "0.1.0"
description = "This is a simple RAG based Q/A app to enquire about LIC's insurance products."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4>=0.0.2",
    "datasets==3.6.0",
    "dotenv>=0.9.9",
    "fsspec>=2025.3.0",
    "gradio>=6.14.0",
    "huggingface-hub>=0.36.2",
    "jq>=1.11.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.4.4",
    "pathlib>=1.0.1",
    "pdfplumber>=0.11.9",
    "protobuf>=7.34.1",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.1",
    "tiktoken>=0.12.0",
    "torch>=2.11.0",
    "transformers==4.57.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "utils"]